#!/usr/bin/nft -f
# Archivo destino: /etc/nftables.conf
# Proyecto: NetWorkLayerProtect — Paso 2
#
# Cambios respecto a la config default de Arch:
# + udp dport 68 accept        — DHCP no se rompe con policy drop
# - tcp dport ssh accept        — sin servidor SSH activo en este equipo
# + chain output explícita      — preparada para kill switch VPN (Paso 6)

destroy table inet filter

table inet filter {

  chain input {
    type filter hook input priority filter
    policy drop

    ct state invalid drop
    ct state { established, related } accept
    iif "lo" accept
    meta l4proto { icmp, icmpv6 } accept

    # DHCP — necesario con policy drop para no bloquear renovación de IP
    udp dport 68 accept
  }

  chain output {
    type filter hook output priority filter
    policy accept

    meta nfproto ipv6 oif != "lo" drop
  }

  chain forward {
    type filter hook forward priority filter
    policy drop

    # Docker — descomentar si containers pierden red al activar nftables:
    # iif "docker0" accept
    # oif "docker0" accept
  }
}
